<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Buttons</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; 
      padding: 20px;
      background: #f2f2f7;
    }
    .btn { 
      padding: 12px 16px; 
      margin: 8px; 
      border: 1px solid #ccc; 
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #e8e8e8; }
    input { 
      padding: 12px; 
      margin: 8px; 
      border: 1px solid #ccc; 
      border-radius: 8px;
      width: 200px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      min-height: 50px;
    }
    .log {
      background: #000;
      color: #0f0;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      margin-top: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🧪 Тест кнопок категорий</h1>
  
  <div>
    <h3>Кнопки быстрого выбора:</h3>
    <button type="button" class="btn category-btn" data-category="Кофе.Вкусвилл">☕ Кофе.Вкусвилл</button>
    <button type="button" class="btn category-btn" data-category="Кофе.Цифра">☕ Кофе.Цифра</button>
    <button type="button" class="btn category-btn" data-category="Столовая.НК">🍽️ Столовая.НК</button>
    <button type="button" class="btn category-btn" data-category="Столовая.Цифра">🍽️ Столовая.Цифра</button>
    <button type="button" class="btn category-btn" data-category="Вода">💧 Вода</button>
    <button type="button" class="btn category-btn" data-category="Продукты">🛒 Продукты</button>
  </div>
  
  <div>
    <h3>Поля ввода:</h3>
    <input type="text" id="title" placeholder="Название">
    <input type="number" id="amount" placeholder="Сумма">
    <button type="button" class="btn" id="addBtn">Добавить</button>
  </div>
  
  <div class="result">
    <strong>Результат:</strong>
    <div id="result">Нажмите на кнопку категории...</div>
  </div>
  
  <div class="log" id="log">Консоль: ждём действий...</div>

  <script>
    const log = document.getElementById('log');
    const result = document.getElementById('result');
    
    function addLog(msg) {
      const now = new Date().toLocaleTimeString();
      log.textContent += `\n[${now}] ${msg}`;
      console.log(msg);
    }
    
    // Ждём загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
      addLog('✅ DOM загружен');
      
      const buttons = document.querySelectorAll('.category-btn');
      addLog(`Найдено кнопок: ${buttons.length}`);
      
      const titleInput = document.getElementById('title');
      const amountInput = document.getElementById('amount');
      const addBtn = document.getElementById('addBtn');
      
      addLog(`Элементы: title=${!!titleInput}, amount=${!!amountInput}, addBtn=${!!addBtn}`);
      
      buttons.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          const category = btn.dataset.category;
          addLog(`🖱️ Нажата кнопка #${idx + 1}: ${category}`);
          
          titleInput.value = category;
          result.innerHTML = `
            <strong>Выбрано:</strong> ${category}<br>
            <strong>Поле "Название":</strong> "${titleInput.value}"
          `;
          
          amountInput.focus();
        });
      });
      
      addBtn.addEventListener('click', () => {
        const title = titleInput.value;
        const amount = amountInput.value;
        
        addLog(`➕ Добавить: ${title} - ${amount} ₽`);
        result.innerHTML = `
          <strong>Добавлено:</strong><br>
          Название: ${title}<br>
          Сумма: ${amount} ₽
        `;
      });
      
      addLog('✅ Обработчики событий установлены');
    });
  </script>
</body>
</html>
